
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Local</title>
</head>
<body>

    <!-- Tabla Semántica de Inventario / Servicios -->
    <table border="1" cellpading="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Servicio / Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>01</td>
                <td>Desarrollo Web HTML5</td>
                <td>Servicios</td>
                <td>$150.00</td>
            </tr>
            <tr>
                <td>02</td>
                <td>Auditoría de Accesibilidad Web</td>
                <td>Consultoría</td>
                <td>$100.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total de servicios disponibles</td>
                <td>2</td>
            </tr>
        </tfoot>
    </table>

    
</body>
</html>
